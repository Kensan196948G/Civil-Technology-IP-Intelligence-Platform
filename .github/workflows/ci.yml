name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deep Debug Round2 で発見: permissions が未指定でリポジトリ既定（read/write混在の
# 可能性あり）に依存していた。GITHUB_TOKEN の既定権限を read-only に固定し、
# 各ジョブで書き込みが必要になった場合はジョブ単位で明示的に昇格させる方針とする。
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm audit)
        # Deep Debug Round2 で発見: audit を全く実行しておらず、docs/50-development/04-cicd-pipeline.md
        # の記載（audit必須）と実態が乖離していた。
        # 本番依存(--prod)の critical は即ブロック（現状ゼロを維持する必須ゲート）。
        # high は Next.js 14系のCVE等、メジャーアップグレードでのみ解消可能な既知・追跡中の
        # 項目を含むため、この場ではCIを赤くせず警告として可視化するに留める
        # （Next.js 14→15移行は別Issueで計画的に実施する方針）。
        run: |
          set -uo pipefail
          echo "### Critical脆弱性チェック（本番依存・必須ゲート） ###"
          pnpm audit --prod --audit-level=critical
          CRITICAL_EXIT=$?
          if [ "$CRITICAL_EXIT" -ne 0 ]; then
            echo "::error::本番依存にcritical severityの脆弱性が検出されました。マージ前に解消してください。"
            exit 1
          fi
          echo "OK: critical severityの脆弱性は検出されませんでした"

          echo "### High以上の脆弱性チェック（本番依存・情報提供） ###"
          pnpm audit --prod --audit-level=high || echo "::warning::本番依存にhigh severityの脆弱性があります（既知の追跡事項を含む可能性）。詳細はログを確認してください。"

      - name: Lint
        run: pnpm --filter @ctiip/web lint

      - name: Typecheck
        run: pnpm --filter @ctiip/web typecheck

      - name: Build
        run: pnpm --filter @ctiip/web build

      - name: Cloudflare Pages build (next-on-pages) verification
        # Deep Debug Round2 で発見: CIは `next build` のみ実行しており、実際の本番デプロイ経路である
        # `@cloudflare/next-on-pages`（Edge Runtime変換）を一度も検証していなかった。
        # ローカルの `next build` は通っても cf:build 側で初めて失敗するケースを防ぐため、
        # マージ前にCI上でも変換が成功することを確認する。
        #
        # 2026-09-06 追記（ユーザー承認済みの暫定対応）: ADR-0007（2026-08-29採択）により
        # 本番・MVPともに自社ホストNode.js（postgres.js、Node組み込みモジュール依存）＋
        # Cloudflare Tunnel構成へ移行済みで、Edge Runtime必須のnext-on-pages変換とは
        # 本質的に非両立になった（全ルートに`export const runtime='edge'`が必要だが、
        # それを行うとDB接続自体が壊れる）。一方 `.github/workflows/deploy-production.yml` は
        # 依然としてこのCloudflare Pagesビルド成果物をwranglerでデプロイする内容のままで、
        # ADR-0007後の実際の本番デプロイ経路（自社ホストNodeへの反映方法）とは不整合な
        # 状態にある（実デプロイ手順の詳細が本リポジトリ内に無いため、パイプライン自体の
        # 再構築は別途対応が必要＝拡張計画書D-5、要決定）。
        # それまでの間、このステップの恒常的な失敗でPRごとの`quality`ジョブが赤くなり
        # 品質シグナルとして機能しなくなっていたため、continue-on-error として
        # 「参考情報として記録はするが、他の必須チェック（lint/typecheck/build/audit/
        # secret-scan）の合否とは独立に扱う」設計に変更する。
        continue-on-error: true
        run: pnpm --filter @ctiip/web cf:build

      - name: Secret scan (簡易)
        # CodeRabbit指摘: 以前は origin/main との git diff に依存しており、
        # actions/checkout の既定 fetch-depth:1 では origin/main がローカルに
        # 存在せず diff が失敗しうる。失敗が 2>/dev/null と if の外側で握りつぶされ、
        # 検査対象が0件のまま「OK」と誤表示する経路があった。
        # → diff ではなく追跡ファイル全体を対象にした git grep へ変更し、
        #   コマンド自体の失敗（grep以外の異常）はジョブ失敗として扱う（pipefail）。
        # docs/ と .env.example は意図的なプレースホルダー例（実在しないダミー値）を
        # 含むため対象外とする。
        # CodeRabbit指摘: このワークフロー自身をスキャン対象から除外すると、
        # 誰かが将来ここへ本物のシークレットを貼り付けても検出できなくなる。
        # パターン文字列を断片から実行時に組み立てることで、このファイル自身に
        # 検知対象の文字列が「リテラルとしては」現れないようにし、除外せずに
        # 自己検知を回避する。
        run: |
          set -euo pipefail
          P1="sk-ant"; P1="${P1}-"
          P2="AKIA"; P2="${P2}[0-9A-Z]{16}"
          P3="-----BEGIN "; P3="${P3}(RSA|EC) PRIVATE KEY-----"
          PATTERN="(${P1}|${P2}|${P3})"
          if git grep -InE "$PATTERN" -- . ':!pnpm-lock.yaml' ':!docs' ':!**/*.example'; then
            echo "::error::シークレットらしき文字列が検出されました"
            exit 1
          fi
          echo "OK: 既知のシークレットパターンは検出されませんでした"

  # E2E（Playwright）
  #
  # Deep Debug 2026-09-10 で判明した問題への対応:
  #   以前は E2E 専用の Repository Secrets（DATABASE_URL_MVP 等）が未設定のため、
  #   e2e-preflight が常に ready=false を返し、E2E ジョブは**毎回 skipped** だった。
  #   結果として Playwright の14フロー（RBAC・行レベル制御・承認・エラーバウンダリ等）が
  #   **PRのマージ判定に一切寄与していなかった**（実際 `gh secret list` は空）。
  #
  #   専用の検証DBを Secrets で用意する運用は、DB分離が前提になるうえ設定漏れで
  #   静かに無効化される。そこで **CI 内で使い捨ての PostgreSQL を service container
  #   として起動**し、Secrets に依存せず E2E を必ず実行する。
  #
  #   - イメージは `pgvector/pgvector:pg16`（`vector` 拡張が必要なため）。
  #   - service container の既定ユーザーはスーパーユーザーなので、
  #     `CREATE EXTENSION vector` を含む db:migrate がそのまま通る
  #     （本番で問題になった「アプリロールでは拡張を導入できない」制約に当たらない）。
  #   - 接続先は本番・MVP のいずれとも無関係な使い捨てDBである。
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ctiip
          POSTGRES_PASSWORD: ctiip_ci_only_password
          POSTGRES_DB: ctiip_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctiip -d ctiip_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 使い捨てDBへの接続情報。実シークレットではないためリポジトリに置いてよい。
      DATABASE_URL: postgresql://ctiip:ctiip_ci_only_password@127.0.0.1:5432/ctiip_e2e
      # seed の安全確認（ホスト名・DB名の完全一致）。使い捨てDBのみを許可する。
      CTIIP_SEED_ALLOWED_HOST: 127.0.0.1
      CTIIP_SEED_ALLOWED_DB: ctiip_e2e
      CTIIP_ALLOW_SEED_TRUNCATE: 'true'
      # E2E 専用の使い捨て署名鍵（値は本番・MVP と無関係）。
      CTIIP_DEMO_COOKIE_SECRET: ctiip-ci-e2e-only-not-a-real-secret
      # Playwright の webServer は http://localhost:3311（HTTP）で起動するため false。
      CTIIP_COOKIE_SECURE: 'false'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (ephemeral DB)
        run: pnpm --filter @ctiip/web db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @ctiip/web exec playwright install --with-deps chromium

      # global-setup.ts が db:seed を実行する（毎回ダミーデータを洗い替える）。
      # ビルドと next start は playwright.config.ts の webServer が行う。
      - name: Run E2E (Playwright)
        working-directory: apps/web
        run: pnpm exec playwright test --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deep Debug Round2 で発見: permissions が未指定でリポジトリ既定（read/write混在の
# 可能性あり）に依存していた。GITHUB_TOKEN の既定権限を read-only に固定し、
# 各ジョブで書き込みが必要になった場合はジョブ単位で明示的に昇格させる方針とする。
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (pnpm audit)
        # Deep Debug Round2 で発見: audit を全く実行しておらず、docs/50-development/04-cicd-pipeline.md
        # の記載（audit必須）と実態が乖離していた。
        # 本番依存(--prod)の critical は即ブロック（現状ゼロを維持する必須ゲート）。
        # high は Next.js 14系のCVE等、メジャーアップグレードでのみ解消可能な既知・追跡中の
        # 項目を含むため、この場ではCIを赤くせず警告として可視化するに留める
        # （Next.js 14→15移行は別Issueで計画的に実施する方針）。
        run: |
          set -uo pipefail
          echo "### Critical脆弱性チェック（本番依存・必須ゲート） ###"
          pnpm audit --prod --audit-level=critical
          CRITICAL_EXIT=$?
          if [ "$CRITICAL_EXIT" -ne 0 ]; then
            echo "::error::本番依存にcritical severityの脆弱性が検出されました。マージ前に解消してください。"
            exit 1
          fi
          echo "OK: critical severityの脆弱性は検出されませんでした"

          echo "### High以上の脆弱性チェック（本番依存・情報提供） ###"
          pnpm audit --prod --audit-level=high || echo "::warning::本番依存にhigh severityの脆弱性があります（既知の追跡事項を含む可能性）。詳細はログを確認してください。"

      - name: Lint
        run: pnpm --filter @ctiip/web lint

      - name: Typecheck
        run: pnpm --filter @ctiip/web typecheck

      - name: Build
        run: pnpm --filter @ctiip/web build

      - name: Cloudflare Pages build (next-on-pages) verification
        # Deep Debug Round2 で発見: CIは `next build` のみ実行しており、実際の本番デプロイ経路である
        # `@cloudflare/next-on-pages`（Edge Runtime変換）を一度も検証していなかった。
        # ローカルの `next build` は通っても cf:build 側で初めて失敗するケースを防ぐため、
        # マージ前にCI上でも変換が成功することを確認する。
        run: pnpm --filter @ctiip/web cf:build

      - name: Secret scan (簡易)
        # CodeRabbit指摘: 以前は origin/main との git diff に依存しており、
        # actions/checkout の既定 fetch-depth:1 では origin/main がローカルに
        # 存在せず diff が失敗しうる。失敗が 2>/dev/null と if の外側で握りつぶされ、
        # 検査対象が0件のまま「OK」と誤表示する経路があった。
        # → diff ではなく追跡ファイル全体を対象にした git grep へ変更し、
        #   コマンド自体の失敗（grep以外の異常）はジョブ失敗として扱う（pipefail）。
        # docs/ と .env.example は意図的なプレースホルダー例（実在しないダミー値）を
        # 含むため対象外とする。
        # CodeRabbit指摘: このワークフロー自身をスキャン対象から除外すると、
        # 誰かが将来ここへ本物のシークレットを貼り付けても検出できなくなる。
        # パターン文字列を断片から実行時に組み立てることで、このファイル自身に
        # 検知対象の文字列が「リテラルとしては」現れないようにし、除外せずに
        # 自己検知を回避する。
        run: |
          set -euo pipefail
          P1="sk-ant"; P1="${P1}-"
          P2="AKIA"; P2="${P2}[0-9A-Z]{16}"
          P3="-----BEGIN "; P3="${P3}(RSA|EC) PRIVATE KEY-----"
          PATTERN="(${P1}|${P2}|${P3})"
          if git grep -InE "$PATTERN" -- . ':!pnpm-lock.yaml' ':!docs' ':!**/*.example'; then
            echo "::error::シークレットらしき文字列が検出されました"
            exit 1
          fi
          echo "OK: 既知のシークレットパターンは検出されませんでした"

  # Secretsの有無だけを判定する軽量ジョブ。
  #
  # 以前は e2e ジョブの中でこの判定を行い、未設定なら後続ステップを個別に skip していた。
  # その場合ジョブ自体は「success（緑）」で完了するため、チェック一覧の見た目上は
  # E2Eが通ったのと区別がつかず、実際には1件も実行されていない状態を緑と誤読しうる。
  # 判定を独立したジョブへ切り出し、e2e 側をジョブレベルの if で制御することで、
  # 未設定時は e2e が「skipped（灰）」として表示され、緑＝実行済みが一致する。
  # （secrets コンテキストはジョブレベルの if では参照できないため、
  #   判定結果を outputs 経由で渡す。Secretsの値そのものは出力しない）
  e2e-preflight:
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check E2E database secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.DATABASE_URL_MVP }}" ] && [ -n "${{ secrets.CTIIP_SEED_ALLOWED_HOST }}" ] && [ -n "${{ secrets.CTIIP_SEED_ALLOWED_DB }}" ] && [ -n "${{ secrets.CTIIP_DEMO_COOKIE_SECRET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "OK: E2E用のSecretsが設定されています。E2Eを実行します。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL_MVP / CTIIP_SEED_ALLOWED_HOST / CTIIP_SEED_ALLOWED_DB / CTIIP_DEMO_COOKIE_SECRET のいずれかがリポジトリSecretsに未設定のため、E2Eジョブをスキップします（skipped表示になります）。専用のE2E用Neonデータベースを用意し、Secretsへ設定してください。"
            {
              echo "### E2E はスキップされました"
              echo ""
              echo "E2E用のSecretsが未設定のため、E2Eジョブを実行していません。"
              echo "**このPRのE2Eは未検証です。** 実行するには次のSecretsを設定してください。"
              echo ""
              echo "- \`DATABASE_URL_MVP\`"
              echo "- \`CTIIP_SEED_ALLOWED_HOST\`"
              echo "- \`CTIIP_SEED_ALLOWED_DB\`"
              echo "- \`CTIIP_DEMO_COOKIE_SECRET\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    runs-on: ubuntu-latest
    needs: [quality, e2e-preflight]
    # 未設定時はジョブごと skip する（success で緑にしない）
    if: needs.e2e-preflight.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @ctiip/web exec playwright install --with-deps chromium

      - name: Run E2E (Playwright)
        working-directory: apps/web
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL_MVP }}
          CTIIP_SEED_ALLOWED_HOST: ${{ secrets.CTIIP_SEED_ALLOWED_HOST }}
          CTIIP_SEED_ALLOWED_DB: ${{ secrets.CTIIP_SEED_ALLOWED_DB }}
          CTIIP_DEMO_COOKIE_SECRET: ${{ secrets.CTIIP_DEMO_COOKIE_SECRET }}
          CTIIP_ALLOW_SEED_TRUNCATE: 'true'
        run: pnpm exec playwright test --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

